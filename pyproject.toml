[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kharita"
version = "0.0.3"
description = "Classified, legended Lonboard maps from one style string."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Munieb Awad" }]
keywords = ["gis", "maps", "lonboard", "choropleth", "geopandas"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "geopandas>=1.0",
    "lonboard[geopandas]>=0.17,<0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["kharita"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
